<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      (function () {
        var t = localStorage.getItem("portfolio-theme");
        if (t === "light") document.documentElement.classList.add("light");
        else if (t !== "dark" && window.matchMedia("(prefers-color-scheme: light)").matches) {
          document.documentElement.classList.add("light");
        }
      })();
    </script>

      content="Nilanchal Sahu — AI/ML Engineer & Data Science Lead. Enterprise AI, LLMs, voice analytics, and cloud-native ML deployment."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
